name: Node Js Run Test
on:
push:
 branches: [main]
pull_request: 
 branches: [main]
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
  -name: Checkout code
   uses: actions/checkout@v3
  -name: Setup Node Js
   uses: actions/Setup-Node@v3
   with: 
    node-version: 20
  -name: Install dependencies
    run: npm ci
  -name: Run this test
    run: npm test

    