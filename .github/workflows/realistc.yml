name: Node Js Run Test

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node Js
        uses: actions/setup-node@v3
        with: 
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run this test
        run: npm test
